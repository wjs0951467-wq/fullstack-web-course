<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 한글이 깨지지 않도록 문자 인코딩을 설정한다. -->
    <meta charset="UTF-8">

    <!-- 모바일 화면 너비에 맞춰 페이지를 표시한다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 브라우저 탭에 표시되는 제목이다. -->
    <title>Member Learning Page</title>
</head>
<body>
    <!-- 문서의 머리말: 대표 제목과 페이지 설명을 담는다. -->
    <header>
        <!-- 이 페이지를 대표하는 제목이다. -->
        <h1>Member Learning Page</h1>

        <!-- 제목을 보충하는 설명 문단이다. -->
        <p>Frontend Basic 학습 기록</p>
    </header>
        <!-- 이 문서의 핵심 콘텐츠를 담는다. -->
    <main>
        <!-- 회원 정보를 하나의 주제로 묶는다. -->
        <section>
            <h2>회원 정보</h2>
            <p>이름: 전예진</p>
            <p>역할: Frontend 학습자</p>
        </section>

        <!-- 학습 목표를 별도의 주제로 묶는다. -->
        <section>
            <h2>학습 목표</h2>

            <!-- 순서가 중요하지 않은 항목들을 목록으로 표시한다. -->
            <ul>
                <li>HTML 문서 구조 이해</li>
                <li>CSS로 화면 구성</li>
                <li>JavaScript로 동작 구현</li>
            </ul>
        </section>
    </main>
        <!-- 문서의 하단에 실습 과정과 챕터 정보를 표시한다. -->
    <footer>
        <p>Phase 01 · Chapter 02</p>
    </footer>
</body>
</html>
