
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. 페이지 제목 -->
    <header class="site-header">
        <h1>Member Management</h1>
    </header>

    <!-- 2. 메인 콘텐츠 -->
    <main class="container">

        <!-- 3. 회원 목록 및 상세 정보 -->
        <section class="member-section">

            <!-- 회원 목록 -->
            <div class="panel">
                <h2>회원 목록</h2>

                <!-- 데이터 로딩 및 오류 상태 메시지 -->
                <div id="status" aria-live="polite"></div>

                <!-- JavaScript에서 회원 목록 생성 -->
                <div id="member-list"></div>
            </div>

            <!-- 회원 상세 -->
            <div class="panel">
                <h2>회원 상세</h2>

                <!-- 선택한 회원 정보 표시 -->
                <div id="member-detail">
                    회원을 선택하세요.
                </div>
            </div>

        </section>

        <!-- 4. 회원 등록 영역 -->
        <section class="panel">
            <h2>회원 등록</h2>

            <form id="member-form">

                <!-- 이름 입력 -->
                <label for="member-name">이름</label>
                <input
                    type="text"
                    id="member-name"
                    name="name"
                    placeholder="이름을 입력하세요."
                    required
                >

                <!-- 이메일 입력 -->
                <label for="member-email">이메일</label>
                <input
                    type="email"
                    id="member-email"
                    name="email"
                    placeholder="이메일을 입력하세요."
                    required
                >

                <!-- 등록 버튼 -->
                <button type="submit">등록 요청</button>
            </form>

            <!-- 등록 결과 메시지 -->
            <p id="form-message" aria-live="polite"></p>
        </section>

    </main>

    <!-- 5. JavaScript 파일 연결 -->
    <script src="app.js"></script>
</body>
</html>
