<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 한글이 깨지지 않도록 설정한다. -->
    <meta charset="UTF-8">

    <!-- 화면 너비에 맞게 페이지를 표시한다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 브라우저 탭에 표시할 제목이다. -->
    <title>예진의 학습 프로필</title>
</head>
<body>
    <!-- 본인의 이름 또는 닉네임을 표시한다. -->
    <h1>전예진</h1>

    <!-- 학습 과정 이름을 표시한다. -->
    <h2>Frontend Basic</h2>

    <!-- 배우고 싶은 내용을 목록으로 표시한다. 원하는 내용으로 바꿔도 된다. -->
    <h3>배우고 싶은 내용</h3>
    <ul>
        <li>HTML로 웹페이지 구조 만들기</li>
        <li>CSS로 웹페이지 디자인하기</li>
        <li>JavaScript로 버튼과 화면에 동작 추가하기</li>
    </ul>

    <!-- 챕터 완료 문구를 표시한다. -->
    <p>Chapter 01 완료</p>
</body>
</html>
