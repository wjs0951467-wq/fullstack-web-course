<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 한글이 깨지지 않도록 문자 인코딩을 설정한다. -->
    <meta charset="UTF-8">

    <!-- 모바일 화면 너비에 맞춰 표시한다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 브라우저 탭에 표시되는 제목이다. -->
    <title>Frontend 첫 실습</title>
</head>
<body>
    <!-- 수업용 GitHub 저장소를 새 탭에서 연다. -->
    <a href="https://github.com/GilbertMoon/fullstack-web-course"
       target="_blank"
       rel="noopener">
        수업용 GitHub 열기
    </a>

    <!-- 다음 콘텐츠를 새 줄에 표시한다. -->
    <br>

    <!-- 구글을 현재 탭에서 연다. -->
    <a href="https://www.google.com">
        구글로 이동
    </a>

    <br>

    <!-- 현재 폴더 안의 images 폴더에서 프로필 이미지를 불러온다. -->
    <img
    src="./images/profile (1).png"
    alt="데이식스 단체 사진"
    width="128"
    height="128"
>
    >
    <h2>회원 목록</h2>

<!-- 회원 정보를 행과 열로 표시한다. -->
<table>
    <!-- 열 제목 영역이다. -->
    <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">이름</th>
            <th scope="col">이메일</th>
            <th scope="col">나이</th>
        </tr>
    </thead>

    <!-- 실제 회원 데이터 영역이다. -->
    <tbody>
        <!-- 한 명의 회원을 하나의 행으로 묶는다. -->
        <tr>
            <td>1</td>
            <td>박성진</td>
            <td>sungjin@example.com</td>
            <td>34</td>
        </tr>
        <tr>
            <td>2</td>
            <td>강영현</td>
            <td>youngk@example.com</td>
            <td>34</td>
        <tr>
            <td>1</td>
            <td>김원필</td>
            <td>wonpil@example.com</td>
            <td>33</td>
        </tr>
        <tr>
            <td>1</td>
            <td>윤도운</td>
            <td>dowoon@example.com</td>
            <td>32</td>
        </tr>
        </tr>
    </tbody>
</table>
<h2>회원 등록</h2>

<!-- 회원 정보를 입력받는 폼이다. -->
<form>
    <div>
        <!-- for와 id를 같게 작성해서 설명과 입력란을 연결한다. -->
        <label for="name">이름</label>
        <input id="name" name="name" type="text" required>
    </div>

    <div>
        <!-- 이메일 형식을 검사하며, 필수 입력 항목이다. -->
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" required>
    </div>

    <div>
        <!-- 1 이상의 숫자를 입력받는다. -->
        <label for="age">나이</label>
        <input id="age" name="age" type="number" min="1">
    </div>

    <!-- 폼 제출을 실행하는 버튼이다. -->
    <button type="submit">회원 등록</button>
</form>
</body>
</html>
