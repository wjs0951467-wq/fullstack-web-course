
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Book Explorer</h1>
    </header>

    <main>
        <!-- 1. 도서 검색 영역 -->
        <section>
            <h2>도서 검색</h2>

            <form id="search-form">
                <label for="search-input">검색어</label>
                <input
                    type="text"
                    id="search-input"
                    name="keyword"
                    placeholder="검색어를 입력하세요."
                    required
                >
                <button type="submit">검색</button>
            </form>

            <p id="status-message">검색어를 입력하세요.</p>
        </section>

        <!-- 2. 검색 결과 목록 -->
        <section>
            <h2>검색 결과 목록</h2>
            <div id="book-list"></div>
        </section>

        <!-- 3. 도서 상세 정보 -->
        <section>
            <h2>도서 상세 정보</h2>
            <div id="book-detail">
                <p>도서를 선택하세요.</p>
            </div>
        </section>

        <!-- 4. 도서 등록 요청 -->
        <section>
            <h2>도서 등록 요청</h2>

            <form id="book-form">
                <label for="book-title">도서 제목</label>
                <input
                    type="text"
                    id="book-title"
                    name="title"
                    placeholder="도서 제목을 입력하세요."
                    required
                >

                <label for="book-author">저자</label>
                <input
                    type="text"
                    id="book-author"
                    name="author"
                    placeholder="저자 이름을 입력하세요."
                    required
                >

                <button type="submit">등록 요청</button>
            </form>

            <p id="form-message"></p>
        </section>
    </main>
</body>
</html>
