<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 05 - CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Box Model 실습</h1>

    <div class="member-card">
        <h2>회원 정보</h2>
        <p>이름: 박성진</p>
        <p>이메일: sungjin@example.com</p>
    </div>
    <hr>

    <h2>Display 속성 실습</h2>
    
    <h3>1. block</h3>
    <div class="block-box">첫 번째 박스</div>
    <div class="block-box">두 번째 박스</div>
    
    <h3>2. inline</h3>
    <span class="inline-box">첫 번째 박스</span>
    <span class="inline-box">두 번째 박스</span>
    
    <h3>3. inline-block</h3>
    <span class="inline-block-box">첫 번째 박스</span>
    <span class="inline-block-box">두 번째 박스</span>
    
    <hr>
    
    <h2>Flexbox 실습</h2>
    
    <div class="flex-container">
        <div class="flex-item">카드 1</div>
        <div class="flex-item">카드 2</div>
        <div class="flex-item">카드 3</div>
    </div>

</body>
</html>
